<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquiliPrism | Interactive Math & Science Puzzles</title>
  <!-- Google Fonts for Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body class="theme-space-dark">
  <div class="app-container">
    <!-- Main Top Navigation -->
    <header class="app-header">
      <div class="header-logo">
        <span class="logo-icon">✦</span>
        <h1>EquiliPrism</h1>
      </div>
      
      <nav class="app-nav" id="main-nav">
        <button class="nav-btn active" data-target="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/></svg>
          Dashboard
        </button>
        <button class="nav-btn" data-target="balance-lab">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M12 2v20M5 22h14M5 6l4 12M15 6l4 12"/></svg>
          Balance Lab
        </button>
        <button class="nav-btn" data-target="photon-lab">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l"/></svg>
          Photon Lab
        </button>
        <button class="nav-btn" data-target="sandbox">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7"/></svg>
          Sandbox
        </button>
        <button class="nav-btn" data-target="explainers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Concept Studio
        </button>
        <button class="nav-btn" data-target="wardrobe">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3h3v3h-3a6 6 0 0 0-6 6h18a6 6 0 0 0-6-6h-3V5a3 3 0 0 0-3-3z"/></svg>
          Sparky Wardrobe
        </button>
        <button class="nav-btn" data-target="videos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="2" ry="2"/>
            <path d="M12 18L12 6"/>
            <path d="M6 12L18 12"/>
            <path d="M2 7L22 7"/>
            <path d="M2 17L22 17"/>
          </svg>
          Videos
        </button>
        <button class="nav-btn" data-target="bugs">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2"/>
            <path d="M12 2v3M12 5a3 3 0 0 0-3 3v3h6V8a3 3 0 0 0-3-3z"/>
            <path d="M4 5l3 3M20 5l-3 3M2 14h2M20 14h2M3 19l3-2M21 19l-3-2"/>
          </svg>
          Report Bug
        </button>
      </nav>

      <div class="header-status">
        <!-- Curriculum Badge -->
        <div class="status-badge grade-badge" id="curriculum-indicator" style="background: rgba(236,72,153,0.1); border: 1px solid rgba(236,72,153,0.3); border-radius: var(--border-radius-sm); padding: 0.4rem 0.6rem; display: flex; gap: 0.6rem; align-items: center;">
          <span class="badge-label" style="color: hsl(var(--accent-pink));">Curriculum</span>
          <span class="badge-val" id="global-curriculum-val" style="color: hsl(var(--accent-pink));">-</span>
        </div>
        <!-- Adaptivity Indicator -->
        <div class="status-badge difficulty-badge" id="difficulty-indicator">
          <span class="badge-label">Level</span>
          <span class="badge-val" id="global-difficulty-val">1.0</span>
        </div>
        <!-- Style Badge -->
        <div class="status-badge style-badge" id="style-indicator">
          <span class="badge-label">Style</span>
          <span class="badge-val" id="global-style-val">Visualizer</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main" id="app-view">
      <!-- SPA Content will be loaded dynamically here -->
       <div class="loading-spinner">Initializing EquiliPrism...</div>
    </main>

    <!-- Sparky, the Empathetic Guide Widget -->
    <div id="sparky-widget-container"></div>
  </div>

  <!-- Onboarding Modal (Country and Grade Selection) -->
  <div id="onboarding-modal" class="modal-overlay">
    <div class="modal-content glass-card onboarding-card" style="max-width: 500px; text-align: center;">
      <h2 style="font-size: 2rem; color: hsl(var(--accent-pink)); margin-bottom: 0.5rem; font-weight: 800;">✦ Welcome to EquiliPrism! ✦</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Let's customize your adaptive learning adventure. Select your country and grade level to align with your school's standards.</p>
      
      <form id="onboarding-form" style="display: flex; flex-direction: column; gap: 1.2rem; text-align: left;">
        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 0.4rem;">Select Your Country:</label>
          <select id="onboarding-country" required style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-main); border-radius: var(--border-radius-sm);">
            <option value="" disabled selected style="background: var(--bg-color);">-- Choose Country --</option>
            <option value="US" style="background: var(--bg-color);">United States (Common Core)</option>
            <option value="UK" style="background: var(--bg-color);">United Kingdom (National Curriculum)</option>
            <option value="IN" style="background: var(--bg-color);">India (CBSE Syllabus)</option>
            <option value="CA" style="background: var(--bg-color);">Canada (Ontario Curriculum)</option>
          </select>
        </div>

        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 0.4rem;">Select Your Grade Level:</label>
          <select id="onboarding-grade" required style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-main); border-radius: var(--border-radius-sm);">
            <option value="" disabled selected style="background: var(--bg-color);">-- Choose Grade --</option>
            <option value="-1" style="background: var(--bg-color);">Preschool / Pre-K (Age 4-5)</option>
            <option value="0" style="background: var(--bg-color);">Kindergarten (Age 5-6)</option>
            <option value="1" style="background: var(--bg-color);">Grade 1 (Age 6-7)</option>
            <option value="2" style="background: var(--bg-color);">Grade 2 (Age 7-8)</option>
            <option value="3" style="background: var(--bg-color);">Grade 3 (Age 8-9)</option>
            <option value="4" style="background: var(--bg-color);">Grade 4 (Age 9-10)</option>
            <option value="5" style="background: var(--bg-color);">Grade 5 (Age 10-11)</option>
            <option value="6" style="background: var(--bg-color);">Grade 6 (Age 11-12)</option>
            <option value="7" style="background: var(--bg-color);">Grade 7 (Age 12-13)</option>
            <option value="8" style="background: var(--bg-color);">Grade 8 (Age 13-14)</option>
            <option value="9" style="background: var(--bg-color);">Grade 9 (Age 14-15)</option>
            <option value="10" style="background: var(--bg-color);">Grade 10 (Age 15-16)</option>
            <option value="11" style="background: var(--bg-color);">Grade 11 (Age 16-17)</option>
            <option value="12" style="background: var(--bg-color);">Grade 12 (Age 17-18)</option>
          </select>
        </div>

        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 0.4rem;">Select Your Learning Style:</label>
          <select id="onboarding-style" required style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-main); border-radius: var(--border-radius-sm);">
            <option value="" disabled selected style="background: var(--bg-color);">-- Choose Learning Style --</option>
            <option value="visualizer" style="background: var(--bg-color);">🎨 Visual Learner (Art & Diagrams)</option>
            <option value="builder" style="background: var(--bg-color);">🛠️ Kinesthetic Learner (Hands-on & Mechanics)</option>
            <option value="logician" style="background: var(--bg-color);">🧮 Logician Learner (Formulas & Equations)</option>
          </select>
        </div>

        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 0.4rem;">Select Your Theme Mode:</label>
          <select id="onboarding-theme" required style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-main); border-radius: var(--border-radius-sm);">
            <option value="" disabled selected style="background: var(--bg-color);">-- Choose Theme Mode --</option>
            <option value="theme-space-dark" style="background: var(--bg-color);">🌌 Dark Mode</option>
            <option value="theme-light" style="background: var(--bg-color);">☀️ Light Mode</option>
            <option value="theme-cyber" style="background: var(--bg-color);">⚡ Neon Mode</option>
            <option value="theme-sunset" style="background: var(--bg-color);">🌅 Sunset Mode</option>
            <option value="theme-ocean" style="background: var(--bg-color);">🌊 Ocean Mode</option>
          </select>
        </div>

        <button type="submit" class="puzzle-btn primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; justify-content: center; font-weight: 700; margin-top: 0.5rem; background: linear-gradient(90deg, hsl(var(--accent-pink)), hsl(var(--accent-cyan)));">
          Start Learning 🚀
        </button>
      </form>
    </div>
  </div>

  <!-- Main ES6 JS Application -->
  <script type="module" src="assets/js/audioManager.js"></script>
  <script type="module" src="assets/js/soundtrack.js"></script>
  <script type="module" src="assets/js/videos.js"></script>
  <script type="module" src="assets/js/creativeSandbox.js"></script>
  <script type="module" src="assets/js/sparkyGuide.js"></script>
  <script type="module" src="assets/js/sparkyWardrobe.js"></script>
  <script type="module" src="assets/js/bugs.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
